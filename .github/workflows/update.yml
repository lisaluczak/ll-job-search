name: Update job listings

on:
  schedule:
    # 14:00 and 00:00 UTC = about 7 AM and 5 PM Pacific (6 AM / 4 PM in winter).
    # GitHub sometimes starts scheduled runs a little late.
    - cron: "0 14 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # adds the "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch roles
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/fetch_jobs.py

      - name: Save results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update roles $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

